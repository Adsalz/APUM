name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Lint, test & build
    runs-on: ubuntu-latest

    env:
      # Valeurs factices : le build CRA a besoin des variables REACT_APP_*
      # au moment de la compilation, mais aucun secret réel n'est requis en CI.
      CI: true
      REACT_APP_FIREBASE_API_KEY: test
      REACT_APP_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      REACT_APP_FIREBASE_DATABASE_URL: https://test.firebaseio.com
      REACT_APP_FIREBASE_PROJECT_ID: test
      REACT_APP_FIREBASE_STORAGE_BUCKET: test.appspot.com
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      REACT_APP_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      REACT_APP_EMAIL_FROM: no-reply@example.com
      REACT_APP_PUBLIC_URL: ""
      REACT_APP_DEBUG: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        run: npm run build
