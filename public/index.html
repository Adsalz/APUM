<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Application de planning pour médecins"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Planning Médecins</title>
    <script>
      // Browser polyfills - must run before any modules load
      (function() {
        'use strict';

        // Define global if not available
        if (typeof window.global === 'undefined') {
          window.global = window;
        }

        // Define process with comprehensive API
        if (typeof window.process === 'undefined') {
          window.process = {
            env: {
              NODE_ENV: 'production',
              BROWSER: 'true'
            },
            version: 'v16.0.0',
            versions: {
              node: '16.0.0'
            },
            platform: 'browser',
            browser: true,
            argv: [],
            title: 'browser',
            pid: 1,
            ppid: 0,
            uid: 501,
            gid: 20,
            cwd: function() { return '/'; },
            chdir: function() {},
            umask: function() { return 0; },
            nextTick: function(callback) {
              setTimeout(callback, 0);
            },
            stdout: { write: function() {} },
            stderr: { write: function() {} },
            stdin: { read: function() {} }
          };
        }

        // Define Buffer if not available
        if (typeof window.Buffer === 'undefined') {
          window.Buffer = {
            isBuffer: function() { return false; },
            from: function() { return []; },
            alloc: function() { return []; },
            allocUnsafe: function() { return []; }
          };
        }

        // Define setImmediate if not available
        if (typeof window.setImmediate === 'undefined') {
          window.setImmediate = function(callback) {
            return setTimeout(callback, 0);
          };
        }

        // Define clearImmediate if not available
        if (typeof window.clearImmediate === 'undefined') {
          window.clearImmediate = function(id) {
            return clearTimeout(id);
          };
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
